name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main, "feat/**"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Type-check
        run: npm run check-types
      - name: Build extension
        run: npm run build
      - name: Run tests
        run: npm test
      - name: Package VSIX
        run: npm run package
      - name: Verify VSIX contents
        run: |
          test -s ai-chatbox-0.5.0.vsix
          unzip -Z1 ai-chatbox-0.5.0.vsix | grep -Fxq "extension/package.json"
          unzip -Z1 ai-chatbox-0.5.0.vsix | grep -Fxq "extension/dist/extension.js"
          unzip -Z1 ai-chatbox-0.5.0.vsix | grep -Fxq "extension/README.md"
          unzip -Z1 ai-chatbox-0.5.0.vsix | grep -Fxq "extension/LICENSE"
          if unzip -Z1 ai-chatbox-0.5.0.vsix | grep -Eq "^extension/(src|test|docs|node_modules)/"; then
            echo "VSIX contains development-only files" >&2
            exit 1
          fi
      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-chatbox-vsix
          path: ai-chatbox-0.5.0.vsix
          if-no-files-found: error
          retention-days: 14
